# factory-judge.yml — two independent models refute a factory PR at its exact head SHA and post
# factory/judge-claude and factory/judge-codex commit statuses. Four jobs on fresh runners so that
# nothing which executes PR code shares a runner with a secret or a token, and the two reviewers share nothing:
#   checks        — permissions {}, no secrets: runs every allowed check; the STEP FAILS if any check fails, and
#                   downstream trusts only the job result (PR code can forge outputs/artifacts, not a job result).
#                   PR code never runs on the runner itself: install happens in a networked throwaway container,
#                   the checks in a --network none one, so nothing PR-controlled survives into a later step or can
#                   read a later action's runtime token (this workflow runs in the base branch's cache scope).
#   judge-claude  — ANTHROPIC_API_KEY only, no GITHUB_TOKEN, own runner
#   judge-codex   — OPENAI_API_KEY only, no GITHUB_TOKEN, own runner
#                   Each checks out the PR with its agent config stripped and builds the same prompt from the PR body
#                   (the worker's copy of the Linear task sections and its assumptions), the diff and the checks
#                   transcript, all as inline text. The model's tools are read-only (Claude: --tools Read,Grep,Glob;
#                   Codex: --sandbox read-only); nothing executes PR code here. The verdict is a job output, never
#                   an artifact, and the model runs without GITHUB_ENV/PATH/OUTPUT so it cannot poison later steps.
#   post          — statuses:write only: fails closed when a verdict is missing or malformed. Every status reads
#                   "<VERDICT> <run id> <attempt> <HMAC-SHA256(FACTORY_JUDGE_KEY, "<pr>:<head>:<base>:<run>:<attempt>:<model>:<VERDICT>")>".
#                   The merge gate verifies signatures, never context names (any PR-added workflow can post a status),
#                   and takes the signed verdict with the HIGHEST (run id, attempt) per model: statuses are append-only, so
#                   a signed REFUTED from a later re-judge cannot be erased or outranked by replaying an older signed
#                   VERIFIED, and verdicts from two attempts of one run (re-runs keep the run id) cannot be mixed.
# Trigger is pull_request_target: since 2025-12-08 GitHub takes this definition, and github.ref, from the DEFAULT branch
# whatever the PR's base is, so a PR cannot rewrite the workflow that judges it. The prompt and the policy are read from
# the PR's base commit, so the checks job refuses to start unless that base IS the default branch (a PR author can
# retarget their PR to a branch carrying a permissive policy). Every secret lives in the GitHub Environment "factory",
# whose deployment branch policy allows only the default branch: environment rules evaluate against github.ref, which is
# refs/pull/N/merge for any pull_request run, so a PR-added workflow gets nothing.
# Needs environment "factory" with ANTHROPIC_API_KEY, OPENAI_API_KEY, FACTORY_JUDGE_KEY (see factory-onboard).
# ponytail: the CLI install lines may need a bump.
name: factory-judge
run-name: "factory-judge #${{ github.event.pull_request.number }} @ ${{ github.event.pull_request.head.sha }}"
on:
  pull_request_target:
    types: [labeled, synchronize, opened, reopened]
permissions: {}
env:
  HEAD: ${{ github.event.pull_request.head.sha }}
  BASE: ${{ github.event.pull_request.base.sha }}
jobs:
  checks:
    # base must be the default branch: policy and prompt are read from the base commit, and the PR author picks the base
    if: contains(github.event.pull_request.labels.*.name, 'factory') && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with: { ref: "${{ github.event.pull_request.head.sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Run every allowed check from BASE policy in throwaway containers (PR code never runs on the runner)
        id: run
        run: |
          p="$RUNNER_TEMP/policy.json"; git show "$BASE:.factory/policy.json" > "$p"
          # The containers get an EXPORT of the PR tree, never the checkout: a writable .git/config (core.fsmonitor and
          # friends) would be executed on the host by git during actions/checkout's post-job cleanup. Not `git archive`:
          # it honors a PR-controlled .gitattributes `export-ignore`, which would hide a failing test from the container.
          w="$RUNNER_TEMP/w"; mkdir -p "$w"
          GIT_INDEX_FILE="$RUNNER_TEMP/idx" git read-tree "$HEAD" && GIT_INDEX_FILE="$RUNNER_TEMP/idx" git checkout-index -a -f --prefix="$w/"
          # belt and braces: every blob in the tree is in the export (gitlinks are not checked out; names may hold newlines)
          [ "$(git ls-tree -r --format='%(objectmode)' "$HEAD" | grep -vc '^160000$')" = "$(cd "$w" && find . \( -type f -o -type l \) -print0 | tr -dc '\0' | wc -c | tr -d ' ')" ] || { echo "export does not match the tree" >&2; exit 1; }
          # check_env / check_setup come from BASE policy: the same env and prep the repo's CI uses for its checks
          { echo HOME=/tmp; jq -r '.check_env // {} | to_entries[] | "\(.key)=\(.value)"' "$p"; } > "$RUNNER_TEMP/check.env"
          # /w (the export) and /tmp (HOME: caches, anything check_setup leaves for the checks) persist across the containers
          mkdir -p "$RUNNER_TEMP/home"
          run() { docker run --rm -u "$(id -u):$(id -g)" --env-file "$RUNNER_TEMP/check.env" -v "$w:/w" -v "$RUNNER_TEMP/home:/tmp" -w /w "$@"; }
          # networked container: each check_setup entry in its own shell, as before (a `cd` or `exit` in one must not leak),
          # then install from the PR's lockfile (nothing executes during install unless BASE policy sets install_scripts)
          jq -r '.check_setup[]?' "$p" > "$RUNNER_TEMP/setup.list"
          printf '%s\n' 'while IFS= read -r s; do bash -c "$s"; done < /setup.list' "npm ci $([ "$(jq -r '.install_scripts // false' "$p")" = true ] || echo --ignore-scripts)" > "$RUNNER_TEMP/setup.sh"
          run -v "$RUNNER_TEMP/setup.sh:/setup.sh:ro" -v "$RUNNER_TEMP/setup.list:/setup.list:ro" node:24 bash -e /setup.sh
          # no-network container: the checks themselves
          out="$RUNNER_TEMP/check-output.txt"; : > "$out"; ok=1
          while IFS= read -r c; do
            echo "### $c" >> "$out"
            if run --network none node:24 bash -c "$c" >> "$out" 2>&1; then echo "exit 0" >> "$out"; else echo "exit $?" >> "$out"; ok=0; fi
          done < <(jq -r '.checks[]' "$p")
          [ "$ok" = 1 ]   # job result is the only signal downstream trusts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        if: always()
        with: { name: "judge-checks-${{ github.event.pull_request.head.sha }}", path: "${{ runner.temp }}/check-output.txt", retention-days: 14 }

  # The two reviewer jobs are deliberately near-identical and separate (not a matrix: matrix legs merge their
  # outputs, last writer wins). The prompt is built per job, on the trusted runner, never in the checks job.
  judge-claude:
    needs: checks            # runs only when every check passed; otherwise post refutes without spending API calls
    runs-on: ubuntu-latest
    permissions: {}
    environment: factory     # the API key is readable only when this workflow was taken from the default branch
    outputs: { verdict: "${{ steps.out.outputs.verdict }}", attempt: "${{ steps.out.outputs.attempt }}" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with: { ref: "${{ github.event.pull_request.head.sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Strip PR-controlled agent config (hooks, settings, instructions) before any model runs
        run: rm -rf .claude .codex .mcp.json CLAUDE.md AGENTS.md .cursor .github/copilot-instructions.md
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with: { name: "judge-checks-${{ github.event.pull_request.head.sha }}", path: "${{ runner.temp }}/checks" }
      - name: Build the prompt (one-pass literal substitution; PR title/body, diff and check transcript are untrusted data)
        env: { TITLE: "${{ github.event.pull_request.title }}", BODY: "${{ github.event.pull_request.body }}", URL: "${{ github.event.pull_request.html_url }}" }
        run: |
          git show "$BASE:.factory/refute-prompt.md" > "$RUNNER_TEMP/refute-prompt.md"
          git diff "$BASE" "$HEAD" > "$RUNNER_TEMP/diff.patch"
          python3 -I - <<'PY'   # -I: no cwd on sys.path, so a PR-added re.py or os.py is never imported
          import os, re; t=os.environ["RUNNER_TEMP"]; e=os.environ
          d=open(f"{t}/diff.patch",errors="replace").read()
          v={"PR_TITLE":e["TITLE"],"PR_BODY":e["BODY"],"PR_URL":e["URL"],"HEAD_SHA":e["HEAD"],"BASE_SHA":e["BASE"],
             "DIFF":d[:150000]+("\n[diff truncated by CI; read the files]" if len(d)>150000 else ""),
             "CHECK_OUTPUT":open(f"{t}/checks/check-output.txt",errors="replace").read()[-20000:]}
          p=re.sub(r"\{\{(\w+)\}\}",lambda m:v.get(m[1],m[0]),open(f"{t}/refute-prompt.md").read())   # one pass: substituted text is never re-scanned
          open(f"{t}/prompt.md","w").write(p)
          PY
      - name: Install the judge CLIs from BASE's lockfile (no API key in this step; the PR checkout is never the source of its own judge)
        run: |
          [ "$(env | grep -c _API_KEY)" = 0 ] || { echo "an API key is in the install step's environment" >&2; exit 1; }
          t="$RUNNER_TEMP/tools"; mkdir -p "$t"
          git show "$BASE:.factory/judge-tools/package.json" > "$t/package.json"
          git show "$BASE:.factory/judge-tools/package-lock.json" > "$t/package-lock.json"
          jq -r '.packages | to_entries[] | select(.value.integrity) | "\(.key) \(.value.integrity)"' "$t/package-lock.json"   # which tools judged this PR, in the log
          (cd "$t" && npm ci --ignore-scripts --no-audit --no-fund --userconfig=/dev/null --globalconfig="$RUNNER_TEMP/no-globalconfig")
          # what is installed is what BASE's lockfile says, not HEAD's: assert the versions, and log the executables' hashes
          for p in @anthropic-ai/claude-code @openai/codex; do
            want=$(jq -r --arg p "node_modules/$p" '.packages[$p].version' "$t/package-lock.json"); have=$(jq -r .version "$t/node_modules/$p/package.json")
            [ "$want" = "$have" ] || { echo "installed $p $have, BASE lockfile says $want" >&2; exit 1; }
          done
          node "$t/node_modules/@anthropic-ai/claude-code/install.cjs"   # the one script that runs: copies the integrity-checked native binary over its placeholder
          sha256sum "$t/node_modules/@anthropic-ai/claude-code/bin/claude.exe"   # identity of the judge binary, in the log
      - name: Claude reviews (read-only tools, agent config off, no GITHUB_ENV/PATH/OUTPUT)
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: |
          env -u GITHUB_ENV -u GITHUB_PATH -u GITHUB_OUTPUT -u GITHUB_STATE "$RUNNER_TEMP/tools/node_modules/.bin/claude" -p "$(cat "$RUNNER_TEMP/prompt.md")" --bare --tools "Read,Grep,Glob" --max-turns 40 > "$RUNNER_TEMP/claude.txt" 2>&1 || true
      - name: Verdict as job output (whole line only, sanitized; anything else becomes CAVEATS downstream)
        id: out
        run: |
          echo "verdict=$(grep -E '^VERDICT: (VERIFIED|CAVEATS|REFUTED)\s*$' "$RUNNER_TEMP/claude.txt" | tail -1 | awk '{print $2}' | tr -cd 'A-Z')" >> "$GITHUB_OUTPUT"
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"   # "re-run failed jobs" reuses this job's outputs from an earlier attempt; post refuses to mix attempts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        if: always()
        with: { name: "judge-claude-${{ github.event.pull_request.head.sha }}", path: "${{ runner.temp }}/claude.txt\n${{ runner.temp }}/prompt.md", retention-days: 14 }

  judge-codex:
    needs: checks
    runs-on: ubuntu-latest
    permissions: {}
    environment: factory
    outputs: { verdict: "${{ steps.out.outputs.verdict }}", attempt: "${{ steps.out.outputs.attempt }}" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with: { ref: "${{ github.event.pull_request.head.sha }}", fetch-depth: 0, persist-credentials: false }
      - name: Strip PR-controlled agent config (hooks, settings, instructions) before any model runs
        run: rm -rf .claude .codex .mcp.json CLAUDE.md AGENTS.md .cursor .github/copilot-instructions.md
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4.3.0
        with: { name: "judge-checks-${{ github.event.pull_request.head.sha }}", path: "${{ runner.temp }}/checks" }
      - name: Build the prompt (one-pass literal substitution; PR title/body, diff and check transcript are untrusted data)
        env: { TITLE: "${{ github.event.pull_request.title }}", BODY: "${{ github.event.pull_request.body }}", URL: "${{ github.event.pull_request.html_url }}" }
        run: |
          git show "$BASE:.factory/refute-prompt.md" > "$RUNNER_TEMP/refute-prompt.md"
          git diff "$BASE" "$HEAD" > "$RUNNER_TEMP/diff.patch"
          python3 -I - <<'PY'   # -I: no cwd on sys.path, so a PR-added re.py or os.py is never imported
          import os, re; t=os.environ["RUNNER_TEMP"]; e=os.environ
          d=open(f"{t}/diff.patch",errors="replace").read()
          v={"PR_TITLE":e["TITLE"],"PR_BODY":e["BODY"],"PR_URL":e["URL"],"HEAD_SHA":e["HEAD"],"BASE_SHA":e["BASE"],
             "DIFF":d[:150000]+("\n[diff truncated by CI; read the files]" if len(d)>150000 else ""),
             "CHECK_OUTPUT":open(f"{t}/checks/check-output.txt",errors="replace").read()[-20000:]}
          p=re.sub(r"\{\{(\w+)\}\}",lambda m:v.get(m[1],m[0]),open(f"{t}/refute-prompt.md").read())   # one pass: substituted text is never re-scanned
          open(f"{t}/prompt.md","w").write(p)
          PY
      - name: Install the judge CLIs from BASE's lockfile (no API key in this step; the PR checkout is never the source of its own judge)
        run: |
          [ "$(env | grep -c _API_KEY)" = 0 ] || { echo "an API key is in the install step's environment" >&2; exit 1; }
          t="$RUNNER_TEMP/tools"; mkdir -p "$t"
          git show "$BASE:.factory/judge-tools/package.json" > "$t/package.json"
          git show "$BASE:.factory/judge-tools/package-lock.json" > "$t/package-lock.json"
          jq -r '.packages | to_entries[] | select(.value.integrity) | "\(.key) \(.value.integrity)"' "$t/package-lock.json"   # which tools judged this PR, in the log
          (cd "$t" && npm ci --ignore-scripts --no-audit --no-fund --userconfig=/dev/null --globalconfig="$RUNNER_TEMP/no-globalconfig")
          # what is installed is what BASE's lockfile says, not HEAD's: assert the versions, and log the executables' hashes
          for p in @anthropic-ai/claude-code @openai/codex; do
            want=$(jq -r --arg p "node_modules/$p" '.packages[$p].version' "$t/package-lock.json"); have=$(jq -r .version "$t/node_modules/$p/package.json")
            [ "$want" = "$have" ] || { echo "installed $p $have, BASE lockfile says $want" >&2; exit 1; }
          done
      - name: Codex reviews (read-only sandbox, agent config off, no GITHUB_ENV/PATH/OUTPUT)
        env: { OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}" }
        run: |
          codex="$RUNNER_TEMP/tools/node_modules/.bin/codex"; sha256sum "$(readlink -f "$codex")"   # from BASE's lockfile, installed in the step above
          # codex 0.164 does not read OPENAI_API_KEY on its own; log in into a throwaway CODEX_HOME and delete it after.
          # The key is still in this step's env (inherent to running an agent with a key); the runner is ephemeral and the key is judge-only.
          export CODEX_HOME=$(mktemp -d); chmod 700 "$CODEX_HOME"
          printenv OPENAI_API_KEY | "$codex" login --with-api-key
          # read-only: the model's shell commands can read the disk (so `git diff` works) and write nothing. Codex's default
          # Linux sandbox (bubblewrap) could not start on a GitHub-hosted runner (RTM_NEWADDR EPERM: it wants a netns);
          # use_legacy_landlock is the namespace-free sandbox, deprecated but present in the pinned 0.164.
          # ponytail: if the sandbox still cannot start, there is no verdict and post fails closed to CAVEATS; fix here, never fall back to danger-full-access.
          env -u GITHUB_ENV -u GITHUB_PATH -u GITHUB_OUTPUT -u GITHUB_STATE "$codex" exec --sandbox read-only --enable use_legacy_landlock --skip-git-repo-check "$(cat "$RUNNER_TEMP/prompt.md")" > "$RUNNER_TEMP/codex.txt" 2>&1 || true
          rm -rf "$CODEX_HOME"
      - name: Verdict as job output (whole line only, sanitized; anything else becomes CAVEATS downstream)
        id: out
        run: |
          echo "verdict=$(grep -E '^VERDICT: (VERIFIED|CAVEATS|REFUTED)\s*$' "$RUNNER_TEMP/codex.txt" | tail -1 | awk '{print $2}' | tr -cd 'A-Z')" >> "$GITHUB_OUTPUT"
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4.6.2
        if: always()
        with: { name: "judge-codex-${{ github.event.pull_request.head.sha }}", path: "${{ runner.temp }}/codex.txt\n${{ runner.temp }}/prompt.md", retention-days: 14 }

  post:
    needs: [checks, judge-claude, judge-codex]
    if: always() && needs.checks.result != 'skipped'
    runs-on: ubuntu-latest
    permissions: { statuses: write }
    environment: factory     # FACTORY_JUDGE_KEY: only a run of this workflow taken from the default branch can sign
    steps:
      - name: Post statuses (the only job with a token; VERIFIED is signed; the job fails unless both are VERIFIED)
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKS: ${{ needs.checks.result }}
          V_CLAUDE: ${{ needs.judge-claude.outputs.verdict }}
          V_CODEX: ${{ needs.judge-codex.outputs.verdict }}
          A_CLAUDE: ${{ needs.judge-claude.outputs.attempt }}
          A_CODEX: ${{ needs.judge-codex.outputs.attempt }}
          KEY: ${{ secrets.FACTORY_JUDGE_KEY }}
          N: ${{ github.event.pull_request.number }}
        run: |
          [ -n "$KEY" ] || { echo "FACTORY_JUDGE_KEY is empty: environment 'factory' missing, or this run was not taken from the default branch" >&2; exit 1; }
          all=1
          for m in claude codex; do
            v=$([ $m = claude ] && echo "$V_CLAUDE" || echo "$V_CODEX")
            a=$([ $m = claude ] && echo "$A_CLAUDE" || echo "$A_CODEX")
            case $v in VERIFIED|CAVEATS|REFUTED) ;; *) v=CAVEATS; echo "no verdict from $m (model error): CAVEATS";; esac   # missing → blocks merge, needs a human, no retry churn
            [ "$a" = "$GITHUB_RUN_ATTEMPT" ] || { v=CAVEATS; echo "$m verdict is from attempt ${a:-?}, this is attempt $GITHUB_RUN_ATTEMPT (re-run failed jobs): CAVEATS"; }   # never sign a verdict this attempt did not produce
            [ "$CHECKS" = success ] || { v=REFUTED; echo "a policy check failed: REFUTED"; }                      # any failing check → refuted
            d="$v $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT $(printf '%s' "$N:$HEAD:$BASE:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT:$m:$v" | openssl dgst -sha256 -mac HMAC -macopt "key:$KEY" | awk '{print $NF}')"
            if [ $v = VERIFIED ]; then st=success; else st=failure; all=0; fi
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD" -f state="$st" -f context="factory/judge-$m" -f description="$d" >/dev/null
            echo "factory/judge-$m=$st ($v, run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT)"
          done
          [ $all = 1 ]   # the run's conclusion is honest for humans; the merge gate trusts the signatures, not this
