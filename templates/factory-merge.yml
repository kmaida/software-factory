# factory-merge.yml — the only thing that merges factory PRs. Installed by /factory:factory-onboard.
# Uses pull_request_target + workflow_run: since 2025-12-08 GitHub takes both the workflow definition and github.ref
# from the DEFAULT branch, whatever the PR's base. The gate script and policy are read from the PR's base commit, so
# the gate refuses any PR whose base is not the default branch BEFORE reading anything from it: a PR author can
# retarget their PR to a branch carrying a hostile gate script. PR code is diffed, never executed.
# Verdicts: every judge status is "<VERDICT> <run> <attempt> <HMAC over pr:head:base:run:attempt:model:verdict>". The
# gate verifies every signature on the head (the status list is append-only, and the fetch fails closed), keeps the
# signed verdict with the highest (run, attempt) per model, and merges only if both are VERIFIED from one attempt of one
# run. Context names prove nothing (any PR-added workflow can post a status); replaying an older signed VERIFIED cannot
# outrank a later signed REFUTED; re-run attempts cannot be mixed; a moved base invalidates all.
# Residual: a PR retargeted to an unprotected branch in the instant between the final base re-check and `gh pr merge`
# would be merged into that branch by the App; the worst case is an App commit on a worker-owned branch, never on main.
# Secrets live in the GitHub Environment "factory" (default branch only): FACTORY_APP_PRIVATE_KEY, FACTORY_JUDGE_KEY.
# Also needs repo var FACTORY_APP_ID, var FACTORY_PAUSED, and a ruleset on main (required CI, up to date, restrict
# updates) whose only bypass is the merge App: the worker's token has contents:write and acts as the owner, so the
# bypass list, not the scopes, is what keeps it from merging.
# ponytail: untested until Phase 2; the gate script is tested, this plumbing is not.
name: factory-merge
on:
  pull_request_target:
    types: [labeled, synchronize]
  workflow_run:            # statuses posted with the workflow token never fire `status`; chain on the judge instead
    workflows: [factory-judge]
    types: [completed]
permissions:
  contents: read
  pull-requests: write
  statuses: read
  checks: read
jobs:
  gate:
    if: vars.FACTORY_PAUSED != 'true'
    runs-on: ubuntu-latest
    environment: factory     # secrets readable only when github.ref is the default branch (pull_request_target: the PR's base)
    steps:
      - name: Resolve PR (and refuse any PR not based on the default branch, before reading from its base)
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT" = "pull_request_target" ]; then n=$PR_NUMBER
          else
            n=$(gh pr list -R "$GITHUB_REPOSITORY" --search "$RUN_SHA" --label factory --state open --json number --jq '.[0].number // empty')
          fi
          [ -n "$n" ] || { echo skip=1 >> "$GITHUB_OUTPUT"; exit 0; }
          # one API call: the base SHA used below and the base name checked here must come from the same snapshot
          pr=$(gh pr view "$n" -R "$GITHUB_REPOSITORY" --json labels,headRefOid,baseRefOid,baseRefName)
          jq -r '"number='"$n"'\nhead=\(.headRefOid)\nbase=\(.baseRefOid)\nfactory=\([.labels[].name]|index("factory")!=null)"' <<<"$pr" >> "$GITHUB_OUTPUT"
          b=$(jq -r .baseRefName <<<"$pr")
          [ "$b" = "$DEFAULT" ] || { gh pr comment "$n" -R "$GITHUB_REPOSITORY" -b "factory: not auto-mergeable — review: base $b is not $DEFAULT"; echo skip=1 >> "$GITHUB_OUTPUT"; }
      - name: Checkout base (PR code is only ever diffed, never run)
        if: steps.pr.outputs.skip != '1' && steps.pr.outputs.factory == 'true'
        uses: actions/checkout@v4
        with: { ref: "${{ github.event.repository.default_branch }}", fetch-depth: 0 }
      - name: CI green? (the judge's statuses and jobs, and this workflow's own job, are excluded; the gate checks the verdicts)
        if: steps.pr.outputs.skip != '1' && steps.pr.outputs.factory == 'true'
        id: ci
        env: { GH_TOKEN: "${{ github.token }}", N: "${{ steps.pr.outputs.number }}" }
        run: |
          # The judge's `post` job fails by design unless both verdicts are VERIFIED, and this job is in progress while
          # it looks; neither is CI. Only the repo's own workflows count here.
          bad=$(gh pr checks "$N" -R "$GITHUB_REPOSITORY" --json name,state,workflow --jq '[.[] | select(.name|startswith("factory/judge-")|not) | select(.workflow!="factory-judge" and .workflow!="factory-merge") | select(.state!="SUCCESS")] | length')
          echo "ok=$([ "$bad" = 0 ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
      - name: Verify signed verdicts (highest (run, attempt) valid signature per model must be VERIFIED; both from one attempt)
        if: steps.ci.outputs.ok == '1'
        id: sig
        env: { GH_TOKEN: "${{ github.token }}", N: "${{ steps.pr.outputs.number }}", HEAD: "${{ steps.pr.outputs.head }}", BASE: "${{ steps.pr.outputs.base }}", KEY: "${{ secrets.FACTORY_JUDGE_KEY }}" }
        run: |
          [ -n "$KEY" ] || { echo "FACTORY_JUDGE_KEY is empty" >&2; exit 1; }
          # The full status list is append-only: a PR-added workflow can ADD statuses (unsigned, or replays of old signed
          # ones) but never remove a signed REFUTED. So: fetch the WHOLE list or fail (a partial list is newest-first and
          # would show only the replays), verify every entry's signature against this pr/head/base, ignore the rest, and
          # let the highest (run id, attempt) win. Both grow monotonically, so a replay never outranks a later verdict and
          # two attempts of one run (re-runs keep the run id) cannot be mixed.
          all=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$HEAD/statuses?per_page=100" --jq '.[] | select(.context|startswith("factory/judge-")) | .context + " " + .description') \
            || { echo "could not fetch the full status list for $HEAD; refusing" >&2; exit 1; }
          missing=; run=
          for m in claude codex; do
            best=; bestrun=0; bestatt=0
            while read -r c v r a s _; do
              [ "$c" = "factory/judge-$m" ] && [ -n "$s" ] || continue
              [ "$s" = "$(printf '%s' "$N:$HEAD:$BASE:$r:$a:$m:$v" | openssl dgst -sha256 -mac HMAC -macopt "key:$KEY" | awk '{print $NF}')" ] || continue
              if [ "$r" -gt "$bestrun" ] 2>/dev/null || { [ "$r" -eq "$bestrun" ] && [ "$a" -gt "$bestatt" ]; } 2>/dev/null; then bestrun=$r; bestatt=$a; best=$v; fi
            done <<<"$all"
            if [ "$best" = VERIFIED ]; then
              [ -z "$run" ] && run="$bestrun.$bestatt"
              [ "$bestrun.$bestatt" = "$run" ] || missing="$missing factory/judge-$m(run $bestrun.$bestatt != $run)"
            else missing="$missing factory/judge-$m(${best:-no valid signature})"; fi
          done
          if [ -n "$missing" ]; then echo "ok=0" >> "$GITHUB_OUTPUT"; echo "out=review: no signed VERIFIED for$missing on ${HEAD:0:7} (base ${BASE:0:7})" >> "$GITHUB_OUTPUT"
          else echo "ok=1" >> "$GITHUB_OUTPUT"; fi
      - name: Risk gate (script and policy from BASE; verdict is the exit code; no secret in this step's env)
        if: steps.sig.outputs.ok == '1'
        id: gate
        env: { GH_TOKEN: "${{ github.token }}", BASE: "${{ steps.pr.outputs.base }}", HEAD: "${{ steps.pr.outputs.head }}" }
        run: |
          git fetch -q origin "$HEAD"
          git show "$BASE:.factory/risk-gate.sh" > "$RUNNER_TEMP/gate.sh"
          if out=$(bash "$RUNNER_TEMP/gate.sh" . "$BASE" "$HEAD" 2>&1); then v=low; else v=review; fi
          d="EOF_$(openssl rand -hex 16)"
          { echo "out<<$d"; printf '%s\n' "$out"; echo "$d"; } >> "$GITHUB_OUTPUT"
          echo "verdict=$v" >> "$GITHUB_OUTPUT"   # written last, after the untrusted block
      - name: Comment if review
        # a skipped step's output is null, and null == '0' is TRUE in an expression (both coerce to 0): check the outcome first
        if: steps.gate.outputs.verdict == 'review' || (steps.sig.outcome == 'success' && steps.sig.outputs.ok == '0')
        env: { GH_TOKEN: "${{ github.token }}", N: "${{ steps.pr.outputs.number }}", OUT: "${{ steps.gate.outputs.out || steps.sig.outputs.out }}" }
        run: |
          gh pr comment "$N" -R "$GITHUB_REPOSITORY" -b "factory: not auto-mergeable — $OUT"
      - name: App token
        if: steps.gate.outputs.verdict == 'low'
        id: app
        uses: actions/create-github-app-token@v2
        with: { app-id: "${{ vars.FACTORY_APP_ID }}", private-key: "${{ secrets.FACTORY_APP_PRIVATE_KEY }}" }
      - name: Merge (re-check the base at the last instant; --match-head-commit binds only the head)
        if: steps.gate.outputs.verdict == 'low'
        env: { GH_TOKEN: "${{ steps.app.outputs.token }}", N: "${{ steps.pr.outputs.number }}", HEAD: "${{ steps.pr.outputs.head }}", DEFAULT: "${{ github.event.repository.default_branch }}" }
        run: |
          b=$(gh pr view "$N" -R "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)
          [ "$b" = "$DEFAULT" ] || { echo "base changed to $b after the gate; not merging" >&2; exit 1; }
          gh pr merge "$N" -R "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$HEAD"
