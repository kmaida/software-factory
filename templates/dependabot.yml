# dependabot.yml — installed by /factory:factory-onboard. Pins move only by PR: the merge gate's .github/* and
# .factory/* deny patterns route every one of these PRs to Kim.
version: 2
updates:
  - package-ecosystem: github-actions       # the SHA-pinned actions in factory-judge.yml and factory-merge.yml
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm                  # the judge CLIs, pinned by .factory/judge-tools/package-lock.json
    directory: /.factory/judge-tools
    schedule: { interval: weekly }
